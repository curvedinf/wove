name: Python 3.16

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    # Pre-release canary: optional dependencies (e.g. cloudpickle) may not
    # support 3.16 yet, so failures here must not block the branch.
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.16
      uses: actions/setup-python@v4
      with:
        python-version: '3.16'
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,examples]
    - name: Run tests
      shell: bash
      run: |
        ./run_tests_and_log.sh
